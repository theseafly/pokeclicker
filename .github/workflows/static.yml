name: Deploy PokeClicker
on:
  push:
    branches: ["develop"] # PokeClicker uses 'develop' as the main branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build the Website
        # This is the specific command from the PokeClicker README
        run: npm run website

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Now that 'npm run website' has run, the docs folder exists!
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
