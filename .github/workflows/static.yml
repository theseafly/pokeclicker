name: Deploy PokeClicker
on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # PokeClicker often has strict version requirements
        run: npm install --legacy-peer-deps

      - name: Build
        # The official repo uses Gulp via this command
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # IMPORTANT: Verify if your repo builds to 'docs' or 'dist'
          # Most PokeClicker forks use 'docs' for GitHub Pages compatibility
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
